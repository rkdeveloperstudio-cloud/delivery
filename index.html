<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>QC DELIVERY</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: #0ea5e9;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #facc15;
      --radius: 16px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      user-select: none;
    }
    input, textarea { user-select: text; }

    /* header */
    .header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    .header-inner {
      max-width: 760px; margin: 0 auto;
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 0.7rem; font-weight: 600;
      padding: 4px 10px; border-radius: 999px;
      background: var(--surface); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .badge.online { color: var(--success); border-color: rgba(34,197,94,0.3); }
    .badge.offline { color: var(--danger); border-color: rgba(239,68,68,0.3); }

    .main {
      max-width: 760px; margin: 0 auto;
      padding: 20px 20px 40px;
      display: flex; flex-direction: column; gap: 18px;
    }

    /* summary cards */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .summary-card.expanded {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .summary-card .label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      display: flex; justify-content: space-between;
    }
    .summary-card .total-amount {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 4px 0 2px;
    }
    .summary-card .count {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .summary-card .expand-hint {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 8px;
      opacity: 0.7;
    }

    /* expandable detail area */
    .details-container {
      margin-top: 6px;
      padding-left: 6px;
      padding-right: 6px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .id-val { color: var(--text); font-weight: 500; }
    .detail-row .amt-val { color: var(--success); font-weight: 600; }

    /* empty / loading states */
    .state-msg {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .hidden { display: none !important; }

    /* navigation link */
    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s;
      touch-action: manipulation;
    }
    .nav-link:hover { border-color: var(--accent); background: var(--surface-hover); }

    @media (max-width: 420px) {
      .summary-grid { grid-template-columns: 1fr; }
    }
    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1 class="logo">QC Delivery</h1>
    <span class="badge" id="statusBadge">Online</span>
  </div>
</header>

<main class="main">
  <!-- Navigation to search page -->
  <a href="#" class="nav-link" id="goToSearch">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    Search & Filter Records
  </a>

  <!-- Dashboard summary grid -->
  <div class="summary-grid" id="summaryGrid">
    <!-- Pending card -->
    <div class="summary-card" data-status="PENDING" id="cardPending">
      <div class="label">Pending <span>⏳</span></div>
      <div class="total-amount" id="pendingTotal">0.00</div>
      <div class="count" id="pendingCount">0 records</div>
      <div class="expand-hint">Tap to expand ▾</div>
      <div class="details-container hidden" id="pendingDetails"></div>
    </div>
    <!-- Processing card -->
    <div class="summary-card" data-status="PROCESSING" id="cardProcessing">
      <div class="label">Processing <span>⚙️</span></div>
      <div class="total-amount" id="processingTotal">0.00</div>
      <div class="count" id="processingCount">0 records</div>
      <div class="expand-hint">Tap to expand ▾</div>
      <div class="details-container hidden" id="processingDetails"></div>
    </div>
    <!-- Received card -->
    <div class="summary-card" data-status="RECEIVED" id="cardReceived">
      <div class="label">Received <span>✅</span></div>
      <div class="total-amount" id="receivedTotal">0.00</div>
      <div class="count" id="receivedCount">0 records</div>
      <div class="expand-hint">Tap to expand ▾</div>
      <div class="details-container hidden" id="receivedDetails"></div>
    </div>
    <!-- Cancelled card -->
    <div class="summary-card" data-status="CANCELLED" id="cardCancelled">
      <div class="label">Cancelled <span>❌</span></div>
      <div class="total-amount" id="cancelledTotal">0.00</div>
      <div class="count" id="cancelledCount">0 records</div>
      <div class="expand-hint">Tap to expand ▾</div>
      <div class="details-container hidden" id="cancelledDetails"></div>
    </div>
  </div>

  <!-- loading / error message -->
  <div id="globalState" class="state-msg">Loading dashboard…</div>
</main>

<script>
  /* ============================================================
     CONFIG – same Supabase project
     ============================================================ */
  const SUPABASE_URL = 'https://qikauwgsqsylseitsoxh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpa2F1d2dzcXN5bHNlaXRzb3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MTc4NjcsImV4cCI6MjA5MDI5Mzg2N30.f4xQpdDIQnfg3ekKnWN6lbvHcnfLVlvmkBCK-8WwDzU';
  const TABLE = 'delivery_records';

  /* ============================================================
     State
     ============================================================ */
  let allRecords = [];
  let expandedStatus = null;   // which status card is currently expanded
  let isLoading = false;

  /* ============================================================
     DOM refs
     ============================================================ */
  const $ = id => document.getElementById(id);
  const statusBadge = $('statusBadge');
  const globalState = $('globalState');

  // elements for each status
  const statusMap = {
    PENDING:   { total: $('pendingTotal'),   count: $('pendingCount'),   details: $('pendingDetails'),   card: $('cardPending') },
    PROCESSING:{ total: $('processingTotal'),count: $('processingCount'),details: $('processingDetails'),card: $('cardProcessing') },
    RECEIVED:  { total: $('receivedTotal'),  count: $('receivedCount'),  details: $('receivedDetails'),  card: $('cardReceived') },
    CANCELLED: { total: $('cancelledTotal'), count: $('cancelledCount'), details: $('cancelledDetails'), card: $('cardCancelled') }
  };

  /* ============================================================
     helpers
     ============================================================ */
  function fmtAmount(v) {
    if (v === null || v === undefined) return '0.00';
    return Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  /* ============================================================
     Fetch data from Supabase (same as original)
     ============================================================ */
  async function fetchRecords() {
    if (isLoading) return;
    isLoading = true;
    globalState.textContent = 'Loading dashboard…';

    try {
      const url = `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.desc&limit=5000`;
      const res = await fetch(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      allRecords = await res.json();

      // cache for offline
      try { localStorage.setItem('delivery_records_cache', JSON.stringify(allRecords)); } catch(e) {}

      setStatus('online');
      globalState.textContent = '';
      updateDashboard();
    } catch (err) {
      console.error('Fetch failed:', err);
      const cached = localStorage.getItem('delivery_records_cache');
      if (cached) {
        allRecords = JSON.parse(cached);
        globalState.textContent = 'Showing cached data (offline)';
        updateDashboard();
      } else {
        globalState.textContent = 'Failed to load data. Check connection.';
      }
      setStatus('offline');
    } finally {
      isLoading = false;
    }
  }

  /* ============================================================
     Update dashboard: totals + counts + detail rows
     ============================================================ */
  function updateDashboard() {
    // reset per-status aggregates
    const aggregates = {
      PENDING:   { total: 0, count: 0, items: [] },
      PROCESSING:{ total: 0, count: 0, items: [] },
      RECEIVED:  { total: 0, count: 0, items: [] },
      CANCELLED: { total: 0, count: 0, items: [] }
    };

    allRecords.forEach(r => {
      const status = (r.status || '').toUpperCase();
      if (aggregates[status]) {
        const amt = (r.amount !== null && r.amount !== undefined) ? Number(r.amount) : 0;
        aggregates[status].total += amt;
        aggregates[status].count += 1;
        aggregates[status].items.push({ id: r.id, amount: amt });
      }
    });

    // update each status card
    for (const [status, data] of Object.entries(aggregates)) {
      const ref = statusMap[status];
      if (!ref) continue;

      // update total and count
      ref.total.textContent = fmtAmount(data.total);
      ref.count.textContent = `${data.count} record${data.count !== 1 ? 's' : ''}`;

      // if this card is currently expanded, refresh its details (id + amount)
      if (expandedStatus === status) {
        renderDetailRows(status, data.items, ref.details);
        ref.details.classList.remove('hidden');
        ref.card.classList.add('expanded');
      } else {
        // ensure details are hidden and card not marked expanded
        ref.details.classList.add('hidden');
        ref.card.classList.remove('expanded');
      }
    }
  }

  /* render id & amount rows inside the expanded detail container */
  function renderDetailRows(status, items, container) {
    if (!items.length) {
      container.innerHTML = `<div class="detail-row" style="justify-content:center; color: var(--text-muted);">No records</div>`;
      return;
    }

    // sort by id ascending for consistency
    const sorted = [...items].sort((a, b) => a.id - b.id);

    container.innerHTML = sorted.map(item => `
      <div class="detail-row">
        <span class="id-val">ID ${esc(item.id)}</span>
        <span class="amt-val">${fmtAmount(item.amount)}</span>
      </div>
    `).join('');
  }

  /* ============================================================
     Toggle expand/collapse for a status card
     ============================================================ */
  function toggleStatus(status) {
    // if clicking the same expanded card -> collapse
    if (expandedStatus === status) {
      // collapse: hide details, remove expanded class
      const ref = statusMap[status];
      if (ref) {
        ref.details.classList.add('hidden');
        ref.card.classList.remove('expanded');
      }
      expandedStatus = null;
      return;
    }

    // collapse any previously expanded card
    if (expandedStatus) {
      const prevRef = statusMap[expandedStatus];
      if (prevRef) {
        prevRef.details.classList.add('hidden');
        prevRef.card.classList.remove('expanded');
      }
    }

    // expand the new one
    expandedStatus = status;

    // rebuild aggregates (or reuse from updateDashboard)
    const aggregates = {
      PENDING:   { total: 0, count: 0, items: [] },
      PROCESSING:{ total: 0, count: 0, items: [] },
      RECEIVED:  { total: 0, count: 0, items: [] },
      CANCELLED: { total: 0, count: 0, items: [] }
    };

    allRecords.forEach(r => {
      const s = (r.status || '').toUpperCase();
      if (aggregates[s]) {
        const amt = (r.amount !== null && r.amount !== undefined) ? Number(r.amount) : 0;
        aggregates[s].items.push({ id: r.id, amount: amt });
      }
    });

    const ref = statusMap[status];
    if (ref && aggregates[status]) {
      renderDetailRows(status, aggregates[status].items, ref.details);
      ref.details.classList.remove('hidden');
      ref.card.classList.add('expanded');
    }
  }

  /* ============================================================
     Attach click listeners to each summary card
     ============================================================ */
  for (const [status, ref] of Object.entries(statusMap)) {
    ref.card.addEventListener('click', (e) => {
      // avoid toggling when clicking inside the details area (but still fine, we can allow)
      // we just call toggleStatus
      toggleStatus(status);
    });
  }

  /* ============================================================
     Online / Offline handling
     ============================================================ */
  function setStatus(s) {
    const isOnline = s === 'online';
    statusBadge.textContent = isOnline ? 'Online' : 'Offline';
    statusBadge.className = 'badge ' + (isOnline ? 'online' : 'offline');
  }

  window.addEventListener('online', () => { setStatus('online'); fetchRecords(); });
  window.addEventListener('offline', () => setStatus('offline'));

  /* ============================================================
     Navigation – go to search page (replace with your actual URL)
     ============================================================ */
  $('goToSearch').addEventListener('click', (e) => {
    e.preventDefault();
    // change to your actual search page filename, e.g., 'search.html'
    window.location.href = 'search.html';
  });

  /* ============================================================
     Init
     ============================================================ */
  setStatus(navigator.onLine ? 'online' : 'offline');
  fetchRecords();
</script>
</body>
</html>
